services:
  api:
    build: .
    ports:
      - "5005:5000"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_KEY\" http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp:
    build: .
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "5006:8000"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
